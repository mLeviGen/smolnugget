[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smolnugget"
dynamic = ["version"]
description = "Keep GitHub repositories and their processes running on a server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Software Distribution",
]

[project.optional-dependencies]
top = ["psutil>=5.9"]   # CPU / memory columns in `snt top`

[project.urls]
Homepage = "https://github.com/mLeviGen/smolnugget"

[project.scripts]
snt = "smolnugget.cli:main"

[tool.setuptools]
packages = ["smolnugget"]

[tool.setuptools.package-data]
smolnugget = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "smolnugget.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
