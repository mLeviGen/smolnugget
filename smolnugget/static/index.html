<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smolnugget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4b5fd'/%3E%3Cpath d='M9 18l5 5 9-12' stroke='%231d1533' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #1e1e21;
  --panel: #2a2a2e;
  --panel-2: #323237;
  --hover: #2d2d32;
  --selected: #34343a;
  --line: #3b3b42;
  --text: #f3f3f6;
  --muted: #9b9ba5;
  --dim: #6f6f78;
  --accent: #c4b5fd;
  --accent-strong: #a78bfa;
  --accent-soft: rgba(196, 181, 253, 0.14);
  --on-accent: #1d1533;
  --ok: #6ee7a8;
  --warn: #fbbf24;
  --err: #f87171;
  --radius: 24px;
  --font: "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
a { color: var(--accent); }
svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* layout ----------------------------------------------------------------- */
.app {
  height: 100%; display: grid;
  grid-template-columns: 196px 1fr;
  grid-template-rows: 52px 1fr;
  grid-template-areas: "top top" "side main";
}
.topbar { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 14px; }
.brand { margin-left: 10px; font-size: 15px; letter-spacing: .2px; }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center;
  color: var(--text); transition: background .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn.muted { color: var(--dim); }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px;
  border-radius: 16px; background: var(--panel); color: var(--muted); font-size: 13px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.running { background: var(--ok); box-shadow: 0 0 0 3px rgba(110, 231, 168, .15); }
.dot.waiting { background: var(--warn); }
.dot.error { background: var(--err); }

.sidebar {
  grid-area: side; align-self: start; margin: 134px 0 0 8px;
  background: var(--panel); border-radius: var(--radius); padding: 8px;
  max-height: calc(100% - 150px); overflow: auto;
}
.nav-item {
  display: flex; align-items: center; gap: 14px; width: 100%; height: 50px; padding: 0 14px;
  border-radius: 16px; color: var(--muted); text-align: left; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; transition: background .15s, color .15s;
}
.nav-item span { overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.active { background: var(--selected); color: var(--text); font-weight: 600; }
.nav-item > svg.i { margin: 0 2px; }
.nav-cover {
  position: relative; width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid;
  place-items: center; font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .92);
}
.nav-cover .dot {
  position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px;
  border: 2px solid var(--panel); box-shadow: none;
}
.nav-item.active .nav-cover .dot { border-color: var(--selected); }
/* burger on wide screens: icons only */
.app { transition: grid-template-columns .18s ease; }
.app.collapsed { grid-template-columns: 82px 1fr; }
.app.collapsed .nav-item { justify-content: center; padding: 0; gap: 0; }
.app.collapsed .nav-text, .app.collapsed .nav-label { display: none; }
.app.collapsed .nav-sep { margin: 8px 6px; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 14px; }
.nav-label { color: var(--dim); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 6px 14px 4px; }

main { grid-area: main; overflow-y: auto; padding: 18px 28px 24px 14px; scrollbar-gutter: stable; }
* { scrollbar-width: thin; scrollbar-color: #4a4a52 transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #46464e; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: #5a5a64; }
::-webkit-scrollbar-button { display: none; }

/* headings & pills ---------------------------------------------------------- */
.head { display: flex; align-items: center; gap: 16px; padding-left: 4px; }
h1 { font-size: 26px; font-weight: 500; margin: 0; letter-spacing: .2px; overflow-wrap: anywhere; }
.head .spacer { flex: 1; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 20px; }
.pill {
  display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px;
  border-radius: 22px; font-size: 15px; font-weight: 500; transition: filter .15s, background .15s;
}
.pill svg.i { width: 20px; height: 20px; }
.pill.primary { background: var(--accent); color: var(--on-accent); }
.pill.primary:hover:not(:disabled) { filter: brightness(1.07); }
.pill.outline { border: 1.5px solid var(--accent); color: var(--accent); }
.pill.outline:hover:not(:disabled), .pill.outline.on { background: var(--accent-soft); }
.pill.neutral { border: 1.5px solid var(--line); background: var(--panel); }
.pill.neutral:hover:not(:disabled) { background: var(--panel-2); }
.summary { color: var(--muted); font-size: 13px; margin-left: 6px; }

/* rows ---------------------------------------------------------------------- */
.list { display: flex; flex-direction: column; gap: 2px; }
.row {
  display: grid; grid-template-columns: 52px 1fr auto auto; align-items: center; gap: 16px;
  min-height: 70px; padding: 9px 12px 9px 9px; border-radius: 14px; cursor: pointer;
  transition: background .12s;
}
.row:hover { background: var(--hover); }
.row.current { background: var(--selected); }
.row.current .title { color: var(--accent); }
.cover {
  width: 52px; height: 52px; border-radius: 6px; display: grid; place-items: center;
  font-weight: 700; font-size: 17px; color: rgba(255, 255, 255, .92); letter-spacing: .5px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .3); flex: none; user-select: none;
}
.cover.big { width: 120px; height: 120px; border-radius: 12px; font-size: 40px; }
.cover.small { width: 44px; height: 44px; border-radius: 8px; font-size: 15px; }
.row-text { min-width: 0; }
.sub {
  color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sub .err { color: var(--err); }
.title { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-act { color: var(--muted); opacity: 0; }
.row:hover .row-act, .row.current .row-act, .row-act:focus-visible { opacity: 1; }
.row-act:hover { color: var(--text); }

.empty {
  margin-top: 40px; padding: 36px; border-radius: var(--radius); background: var(--panel);
  color: var(--muted); max-width: 640px;
}
.empty h2 { color: var(--text); font-weight: 500; font-size: 20px; margin: 0 0 8px; }
code, .code {
  font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--accent);
  padding: 2px 8px; border-radius: 6px;
}
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 16px;
  background: rgba(248, 113, 113, .1); color: #fecaca; margin-bottom: 16px; font-size: 14px;
}
.banner svg.i { color: var(--err); }
.banner.info { background: var(--accent-soft); color: var(--text); }
.banner.info svg.i { color: var(--accent); }
.banner pre { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.5 var(--mono); color: #fca5a5; }

/* detail -------------------------------------------------------------------- */
.detail-head { display: flex; gap: 24px; align-items: flex-end; padding-left: 4px; }
.detail-head .sub { margin-bottom: 4px; }
.detail-head h1 { font-size: 34px; }
.detail-head .repo { color: var(--muted); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.card { background: var(--panel); border-radius: var(--radius); padding: 18px 20px; }
.card h3 {
  margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .8px; display: flex; align-items: center; gap: 10px;
}
.card h3 .spacer { flex: 1; }
.toggle { font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500;
  border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; }
.toggle.on { color: var(--accent); border-color: var(--accent); }
.log {
  height: min(56vh, 560px); overflow: auto; margin: 0 -6px; padding: 4px 6px;
  font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
}
.log .ln { color: #d6d6dc; }
.log .ts { color: var(--dim); }
.log .ev { color: var(--accent); }
.log .ev.warn { color: var(--warn); }
.log .ev.error { color: var(--err); }
.log .none { color: var(--dim); font-family: var(--font); }
.kv { display: grid; gap: 14px; }
.kv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.kv .v { margin-top: 2px; overflow-wrap: anywhere; font-size: 14px; }
.kv .v.mono { font-family: var(--mono); font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--panel-2); color: var(--text); padding: 12px 20px; border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .4); transition: opacity .2s, transform .2s; pointer-events: none;
  max-width: min(560px, calc(100% - 32px)); font-size: 14px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #4a2025; color: #fecaca; }

/* system page ---------------------------------------------------------------- */
.host { color: var(--muted); font-size: 14px; margin: 8px 0 20px 4px; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--panel); border-radius: var(--radius); padding: 18px 20px 16px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
.tile .big { font-size: 34px; font-weight: 500; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.tile .small { color: var(--muted); font-size: 13px; }
.chart { position: relative; height: 64px; margin-top: 14px; cursor: crosshair; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .tip {
  position: absolute; top: -30px; transform: translateX(-50%); background: var(--panel-2);
  color: var(--text); padding: 3px 9px; border-radius: 8px; font-size: 12px; white-space: nowrap;
  pointer-events: none; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}
.chart .empty-chart { color: var(--dim); font-size: 12px; padding-top: 22px; }
.meter { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; margin-top: 16px; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.warn > i { background: var(--warn); }
.meter.crit > i { background: var(--err); }
.state { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--text); }
.state svg.i { width: 18px; height: 18px; }
.state.warn svg.i { color: var(--warn); }
.state.crit svg.i { color: var(--err); }
.usage { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px 90px minmax(80px, 1.2fr); gap: 14px; align-items: center; }
.usage + .usage { margin-top: 12px; }
.usage .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usage .num { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.usage .meter { margin-top: 0; height: 6px; }
.usage.head { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }

/* narrow screens ------------------------------------------------------------------ */
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
  .sidebar {
    position: fixed; z-index: 5; left: 8px; top: 56px; margin: 0; width: 240px;
    max-height: calc(100% - 70px); box-shadow: 0 16px 40px rgba(0, 0, 0, .5); display: none;
  }
  .app.nav-open .sidebar { display: block; }
  main { padding: 10px 16px 20px; }
  .grid { grid-template-columns: 1fr; }
  .detail-head .cover.big { width: 84px; height: 84px; font-size: 28px; }
  .detail-head h1 { font-size: 26px; }
  .row { grid-template-columns: 52px 1fr auto; }
  .row-meta { display: none; }
  .row-act { opacity: 1; }
  .chip .chip-text { display: none; }
  .app.collapsed { grid-template-columns: 1fr; }
  .usage { grid-template-columns: 26px minmax(0, 1fr) 60px 80px; }
  .usage .meter { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню"></button>
    <span class="brand">smolnugget</span>
    <span class="spacer"></span>
    <span class="chip" id="daemonChip"></span>
  </header>
  <aside class="sidebar" id="sidebar" aria-label="Навигация"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const ICONS = {
  menu: "M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z",
  gauge: "M20.38 8.57l-1.23 1.85a8 8 0 01-.22 7.58H5.07A8 8 0 0115.58 6.85l1.85-1.23A10 10 0 003.35 19a2 2 0 001.72 1h13.85a2 2 0 001.74-1 10 10 0 00-.27-10.44zm-9.79 6.84a2 2 0 002.83 0l5.66-8.49-8.49 5.66a2 2 0 000 2.83z",
  home: "M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z",
  play: "M8 5v14l11-7z",
  pause: "M6 19h4V5H6v14zm8-14v14h4V5h-4z",
  restart: "M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z",
  update: "M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A6 6 0 006 20h13a5 5 0 00.35-9.96zM17 13l-5 5-5-5h3V9h4v4h3z",
  sort: "M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z",
  filter: "M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z",
  warn: "M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z",
  info: "M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z",
  server: "M20 13H4a1 1 0 00-1 1v6a1 1 0 001 1h16a1 1 0 001-1v-6a1 1 0 00-1-1zM7 19a2 2 0 110-4 2 2 0 010 4zM20 3H4a1 1 0 00-1 1v6a1 1 0 001 1h16a1 1 0 001-1V4a1 1 0 00-1-1zM7 9a2 2 0 110-4 2 2 0 010 4z",
};
const icon = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const store = {
  get(k, d) { try { const v = localStorage.getItem("snt." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("snt." + k, JSON.stringify(v)); } catch {} },
};

const STATUS = { running: "работает", waiting: "ожидает", stopped: "остановлено", disabled: "выключено" };
const SORTS = [["name", "имя"], ["status", "статус"], ["uptime", "время работы"]];
const S = {
  snap: null, error: null,
  sort: store.get("sort", "name"), problemsOnly: false,
  current: store.get("current", null),
  logs: [], logsFor: null, follow: true, detailFor: null,
};

/* helpers ---------------------------------------------------------------- */
function hue(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function cover(name, cls = "") {
  const h = hue(name);
  const letters = (name.replace(/[^A-Za-zА-Яа-я0-9]+/g, " ").trim().split(" ").map((w) => w[0]).join("").slice(0, 2) || name.slice(0, 2)).toUpperCase();
  return `<div class="cover ${cls}" style="background:linear-gradient(135deg,hsl(${h} 55% 62%),hsl(${(h + 40) % 360} 50% 34%))">${esc(letters)}</div>`;
}
function miniCover(a) {
  const h = hue(a.name);
  const letters = (a.name.replace(/[^A-Za-zА-Яа-я0-9]+/g, " ").trim().split(" ").map((w) => w[0]).join("").slice(0, 2) || a.name.slice(0, 2)).toUpperCase();
  return `<span class="nav-cover" style="background:linear-gradient(135deg,hsl(${h} 55% 62%),hsl(${(h + 40) % 360} 50% 34%))">${esc(letters)}<span class="dot ${statusDot(a)}"></span></span>`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
}
function dur(s) {
  if (s == null) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d} д ${h} ч`;
  if (h) return `${h} ч ${m} мин`;
  if (m) return `${m} мин`;
  return `${s} с`;
}
function clock(s) { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function bytes(n) { if (n == null) return ""; const u = ["Б", "КБ", "МБ", "ГБ"]; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`; }
function ago(iso) {
  if (!iso) return "никогда";
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  return s < 5 ? "только что" : `${dur(s)} назад`;
}
function shortRepo(url) {
  const gh = url.match(/github\.com[/:]([^/]+\/[^/]+?)(\.git)?\/?$/);
  if (gh) return gh[1];
  return url.replace(/[\\/]+$/, "").split(/[\\/:]/).pop().replace(/\.git$/, "");
}
function apps() { return S.snap ? S.snap.apps : []; }
function app(name) { return apps().find((a) => a.name === name); }
function isProblem(a) { return !!a.last_error || a.status === "waiting" || (a.status === "stopped" && a.enabled); }
function statusDot(a) { return a.last_error ? "error" : a.status; }
function route() {
  if (location.hash === "#/system") return { view: "system" };
  const m = location.hash.match(/^#\/app\/(.+)$/);
  return m ? { view: "app", name: decodeURIComponent(m[1]) } : { view: "home" };
}
function go(hash) { if (location.hash !== hash) location.hash = hash; else render(); }

/* api -------------------------------------------------------------------- */
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((data && data.error) || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return data;
}
const ACT_TEXT = { restart: "перезапуск", update: "проверка обновлений", start: "запуск", stop: "остановка" };
async function act(name, action, quiet) {
  if (!S.snap.daemon.running && action !== "stop" && action !== "start") {
    return toast("Демон snt не запущен. Запустите его: snt run", true);
  }
  try {
    await api(`/api/apps/${encodeURIComponent(name)}/${action}`, { method: "POST", headers: { "X-Snt": "1" } });
    if (!quiet) {
      let msg = `${name}: ${ACT_TEXT[action]}`;
      if (action === "start" && !S.snap.daemon.running) msg += " — запустится вместе с демоном (snt run)";
      toast(msg);
    }
  } catch (e) {
    toast(e.status === 409 ? `${name} сейчас не работает — включите его или запустите snt run` : `Ошибка: ${e.message}`, true);
  }
  setTimeout(poll, 300);
}
async function updateAll() {
  const live = apps().filter((a) => a.status === "running" || a.status === "waiting");
  if (!live.length) return toast("Нет работающих приложений", true);
  await Promise.all(live.map((a) => act(a.name, "update", true)));
  toast(`Проверка обновлений: ${live.length} ${plural(live.length, "приложение", "приложения", "приложений")}`);
}
let toastTimer;
function toast(text, bad = false) {
  const t = $("#toast");
  t.textContent = text; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast" + (bad ? " bad" : "")), 3200);
}

/* rendering -------------------------------------------------------------- */
// Touch the DOM only where the markup changed: keeps focus, hover and clicks intact
// across the 2-second refreshes.
function patch(el, html) {
  if (el && el.__html !== html) { el.__html = html; el.innerHTML = html; }
}
function patchList(box, items) {
  const old = new Map([...box.children].map((c) => [c.dataset.key, c]));
  let prev = null;
  for (const { key, html } of items) {
    let el = old.get(key);
    old.delete(key);
    if (!el || el.__html !== html) {
      const tpl = document.createElement("template");
      tpl.innerHTML = html.trim();
      const fresh = tpl.content.firstElementChild;
      fresh.dataset.key = key; fresh.__html = html;
      const hadFocus = el && el.contains(document.activeElement);
      const focusSel = hadFocus && document.activeElement.matches("[data-act]") ? "[data-act]" : null;
      if (el) el.replaceWith(fresh);
      el = fresh;
      if (hadFocus) (focusSel ? el.querySelector(focusSel) : el).focus({ preventScroll: true });
    }
    const want = prev ? prev.nextElementSibling : box.firstElementChild;
    if (want !== el) box.insertBefore(el, want);
    prev = el;
  }
  old.forEach((el) => el.remove());
}
function setMain(mode, skeleton) {
  if (S.mainMode !== mode) { S.mainMode = mode; const m = $("#main"); m.__html = null; m.innerHTML = skeleton; return true; }
  return false;
}
function renderChrome() {
  patch($("#menuBtn"), icon("menu"));
  const d = S.snap && S.snap.daemon;
  patch($("#daemonChip"), S.error
    ? `<span class="dot error"></span><span class="chip-text">нет связи с snt web</span>`
    : !d ? "" : d.running
      ? `<span class="dot running"></span><span class="chip-text">демон работает · pid ${d.pid}</span>`
      : `<span class="dot waiting"></span><span class="chip-text">демон не запущен</span>`);
}

function renderSidebar() {

  let html = `<button class="nav-item ${r.view === "home" ? "active" : ""}" data-go="#/" title="Обзор">${icon("home")}<span class="nav-text">Обзор</span></button>
    <button class="nav-item ${r.view === "system" ? "active" : ""}" data-go="#/system" title="Система">${icon("gauge")}<span class="nav-text">Система</span></button>`;
  if (apps().length) html += `<div class="nav-sep"></div><div class="nav-label">Приложения</div>`;
  for (const a of apps()) {

function subline(a) {
  const parts = [STATUS[a.status] || a.status];
  if (a.status === "running") parts.push(dur(a.uptime_seconds));
  if (a.repo.branch) parts.push(a.repo.branch);
  if (a.restarts) parts.push(`${a.restarts} ${plural(a.restarts, "перезапуск", "перезапуска", "перезапусков")}`);
  let html = esc(parts.join(" · "));
  if (a.last_error) html += ` · <span class="err">ошибка</span>`;
  return html;
}

function sorted(list) {
  const order = { running: 0, waiting: 1, stopped: 2, disabled: 3 };
  const by = {
    name: (a, b) => a.name.localeCompare(b.name),
    status: (a, b) => (!!b.last_error - !!a.last_error) || order[a.status] - order[b.status] || a.name.localeCompare(b.name),
    uptime: (a, b) => (b.uptime_seconds ?? -1) - (a.uptime_seconds ?? -1) || a.name.localeCompare(b.name),
  }[S.sort];
  return [...list].sort(by);
}

function renderLogs() {
  const el = $("#log");
  if (!el) return;
  if (!S.logs.length) { el.innerHTML = `<span class="none">Лог пока пуст.</span>`; return; }
  el.innerHTML = S.logs.map((line) => {
    const m = line.match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) (\*|\s) ?(.*)$/);
    if (!m) return `<div class="ln">${esc(line)}</div>`;
    const ts = `<span class="ts">${m[1].slice(11)}</span> `;
    if (m[2] === "*") {
      const lvl = /^(warning|error)/.exec(m[3]);
      return `<div>${ts}<span class="ev ${lvl ? (lvl[1] === "warning" ? "warn" : "error") : ""}">● ${esc(m[3].replace(/^info: /, ""))}</span></div>`;
    }
    return `<div class="ln">${ts}${esc(m[3])}</div>`;
  }).join("");
  if (S.follow) el.scrollTop = el.scrollHeight;
}

async function loadLogs() {
  const r = route();
  if (r.view !== "app") return;
  const name = r.name;
  try {
    const data = await api(`/api/apps/${encodeURIComponent(name)}/logs?lines=400`);
    const changed = S.logsFor !== name || data.lines.length !== S.logs.length || data.lines[data.lines.length - 1] !== S.logs[S.logs.length - 1];
    S.logsFor = name; S.logs = data.lines;
    if (changed) renderLogs();
  } catch {}
}

/* system page ------------------------------------------------------------ */
const HIST_MAX = 90; // 3 minutes at one sample per 2 s
const HIST = { cpu: [], mem: [] };
function pushHist(arr, v) { if (v == null) return; arr.push({ t: Date.now(), v }); if (arr.length > HIST_MAX) arr.shift(); }
function hhmmss(t) { return new Date(t).toLocaleTimeString("ru-RU"); }
function pct(v) { return v == null ? "—" : `${Math.round(v)}%`; }

// Single-series line in the accent colour; fixed 0-100 scale; crosshair + tooltip on hover.
function drawChart(el, data) {
  if (!el) return;
  if (data.length < 2) { patch(el, `<div class="empty-chart">график появится через пару секунд…</div>`); return; }
  const w = Math.max(80, el.clientWidth), h = el.clientHeight || 64, pad = 2;
  const span = (HIST_MAX - 1) * 2000, t1 = data[data.length - 1].t, t0 = t1 - span;
  const X = (t) => pad + ((t - t0) / span) * (w - 2 * pad);
  const Y = (v) => h - pad - (Math.min(100, Math.max(0, v)) / 100) * (h - 2 * pad);
  const pts = data.map((d) => `${X(d.t).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const area = `${X(data[0].t).toFixed(1)},${h - pad} ${pts} ${X(t1).toFixed(1)},${h - pad}`;
  let hover = "";
  const i = el.__hover;
  if (i != null && data[i]) {
    const x = X(data[i].t), y = Y(data[i].v);
    hover = `<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="var(--line)" stroke-width="1"/>
      <circle cx="${x}" cy="${y}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
  }
  const svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="история за 3 минуты">
    <line x1="0" x2="${w}" y1="${h - pad}" y2="${h - pad}" stroke="var(--line)" stroke-width="1"/>
    <polygon points="${area}" fill="var(--accent-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${hover}</svg>`;
  const tip = i != null && data[i] ? `<div class="tip" style="left:${X(data[i].t)}px">${pct(data[i].v)} · ${hhmmss(data[i].t)}</div>` : "";
  patch(el, svg + tip);
}
function bindChart(el, key) {
  if (!el || el.__bound) return;
  el.__bound = true;
  const pick = (e) => {
    const data = HIST[key];
    if (!data.length) return;
    const rect = el.getBoundingClientRect(), w = rect.width;
    const span = (HIST_MAX - 1) * 2000, t1 = data[data.length - 1].t, t0 = t1 - span;
    const t = t0 + ((e.clientX - rect.left) / w) * span;
    let best = 0;
    data.forEach((d, j) => { if (Math.abs(d.t - t) < Math.abs(data[best].t - t)) best = j; });
    el.__hover = best; drawChart(el, data);
  };
  el.addEventListener("mousemove", pick);
  el.addEventListener("mouseleave", () => { el.__hover = null; drawChart(el, HIST[key]); });
}

function level(p) { return p == null ? "" : p >= 90 ? "crit" : p >= 80 ? "warn" : ""; }
function stateLine(p, what) {
  const l = level(p);
  if (!l) return "";
  return `<div class="state ${l}">${icon("warn")}${l === "crit" ? `${what} почти заполнен` : `${what} заполнен больше чем на 80%`}</div>`;
}

function renderSystem() {
  const fresh = setMain("system", `
    <div class="head"><h1>Система</h1></div>
    <div class="host" id="sys-host"></div>
    <div class="tiles">
      <section class="tile"><div class="k">Процессор</div><div class="big" id="cpu-val">—</div><div class="small" id="cpu-sub"></div><div class="chart" id="cpu-chart"></div></section>
      <section class="tile"><div class="k">Память</div><div class="big" id="mem-val">—</div><div class="small" id="mem-sub"></div><div class="chart" id="mem-chart"></div></section>
      <section class="tile"><div class="k">Диск</div><div class="big" id="disk-val">—</div><div class="small" id="disk-sub"></div><div id="disk-extra"></div></section>
      <section class="tile"><div class="k">Сервер</div><div class="big" id="up-val">—</div><div class="small" id="up-sub"></div><div id="up-extra"></div></section>
    </div>
    <section class="card"><h3>Приложения</h3><div id="sys-apps"></div></section>`);
  S.detailFor = null;
  if (fresh) { bindChart($("#cpu-chart"), "cpu"); bindChart($("#mem-chart"), "mem"); }
  const s = S.sys;
  if (!s) { patch($("#sys-host"), S.sysError ? `Нет данных: ${esc(S.sysError)}` : "Загрузка…"); return; }
  patch($("#sys-host"), `${esc(s.hostname)} · ${esc(s.os)} · ${esc(s.arch)}`);

  patch($("#cpu-val"), pct(s.cpu_percent));
  const load = s.load_avg ? ` · нагрузка ${s.load_avg.join(" / ")}` : "";
  patch($("#cpu-sub"), `${s.cpu_count || "?"} ${plural(s.cpu_count || 0, "ядро", "ядра", "ядер")}${load}`);
  drawChart($("#cpu-chart"), HIST.cpu);

  const m = s.memory;
  patch($("#mem-val"), m ? pct(m.percent) : "—");
  patch($("#mem-sub"), m ? `${bytes(m.used)} из ${bytes(m.total)} · свободно ${bytes(m.available)}` : "нет данных");
  drawChart($("#mem-chart"), HIST.mem);

  const d = s.disk;
  patch($("#disk-val"), d ? pct(d.percent) : "—");
  patch($("#disk-sub"), d ? `свободно ${bytes(d.free)} из ${bytes(d.total)}` : "нет данных");
  patch($("#disk-extra"), d ? `<div class="meter ${level(d.percent)}" title="${esc(d.path)}"><i style="width:${d.percent}%"></i></div>${stateLine(d.percent, "Диск")}` : "");

  patch($("#up-val"), dur(s.uptime_seconds));
  patch($("#up-sub"), `без перезагрузки · Python ${esc(s.python)} · snt ${esc(s.smolnugget)}`);
  patch($("#up-extra"), s.psutil ? "" : `<div class="state">${icon("info")}для CPU и памяти поставьте psutil</div>`);

  const live = apps().filter((a) => a.pid);
  const total = m ? m.total : null;
  patch($("#sys-apps"), !live.length ? `<div class="small" style="color:var(--muted)">Нет запущенных приложений.</div>` :
    `<div class="usage head"><span></span><span>приложение</span><span class="num">CPU</span><span class="num">память</span><span></span></div>` +
    live.map((a) => {
      const share = total && a.memory_bytes != null ? (a.memory_bytes / total) * 100 : null;
      return `<div class="usage">${miniCover(a)}<span class="name">${esc(a.name)}</span>
        <span class="num">${a.cpu_percent != null ? `${Math.round(a.cpu_percent)}%` : "—"}</span>
        <span class="num">${a.memory_bytes != null ? bytes(a.memory_bytes) : "—"}</span>
        <div class="meter" title="${share != null ? `${share.toFixed(1)}% памяти сервера` : ""}"><i style="width:${share != null ? Math.max(1, share) : 0}%"></i></div></div>`;
    }).join(""));
}

async function pollSystem() {
  try {
    S.sys = await api("/api/system"); S.sysError = null;
    pushHist(HIST.cpu, S.sys.cpu_percent);
    pushHist(HIST.mem, S.sys.memory && S.sys.memory.percent);
  } catch (e) { S.sysError = e.message; }
  if (route().view === "system" && S.snap) renderSystem();
}

function render() {
  renderChrome();
  renderSidebar();
  const r = route();
  if (!S.snap) {
    S.mainMode = null; S.detailFor = null;
    patch($("#main"), S.error ? `<div class="empty"><h2>Нет связи</h2>Не удаётся получить статус: ${esc(S.error)}. Запущен ли <code>snt web</code>?</div>` : "");
  } else if (r.view === "system") {
    renderSystem();
  } else if (r.view === "app") {
    if (S.current !== r.name && app(r.name)) { S.current = r.name; store.set("current", r.name); }
    renderDetail(r.name);
  } else {
    renderHome();
  }
  document.title = r.view === "app" ? `${r.name} · smolnugget` : r.view === "system" ? "Система · smolnugget" : "smolnugget";
}

async function poll() {
  try { S.snap = await api("/api/status"); S.error = null; }
  catch (e) { S.error = e.message; }
  render();
}

/* events ----------------------------------------------------------------- */
document.addEventListener("click", (e) => {
  const actBtn = e.target.closest("[data-act]");
  if (actBtn) { e.stopPropagation(); if (!actBtn.disabled) act(actBtn.dataset.name, actBtn.dataset.act); return; }
  const action = e.target.closest("[data-action]");
  if (action) {
    const k = action.dataset.action;
    if (k === "update-all") updateAll();
    if (k === "problems") { S.problemsOnly = !S.problemsOnly; render(); }
    if (k === "sort") { const i = SORTS.findIndex((s) => s[0] === S.sort); S.sort = SORTS[(i + 1) % SORTS.length][0]; store.set("sort", S.sort); render(); }
    return;
  }
  const nav = e.target.closest("[data-go]");
  if (nav) { $("#app").classList.remove("nav-open"); go(nav.dataset.go); return; }
  const row = e.target.closest("[data-open]");
  if (row) { go(`#/app/${encodeURIComponent(row.dataset.open)}`); return; }
  if (e.target.closest("#followBtn")) {
    S.follow = !S.follow; $("#followBtn").classList.toggle("on", S.follow);
    if (S.follow) $("#log").scrollTop = $("#log").scrollHeight;
  }
  if (!e.target.closest("#sidebar") && !e.target.closest("#menuBtn")) $("#app").classList.remove("nav-open");
});
document.addEventListener("keydown", (e) => {
  const row = e.target.closest && e.target.closest("[data-open]");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(`#/app/${encodeURIComponent(row.dataset.open)}`); }
  if (e.key === "Escape" && route().view === "app") go("#/");
});
const narrow = window.matchMedia("(max-width: 820px)");
if (store.get("collapsed", false)) $("#app").classList.add("collapsed");
$("#menuBtn").addEventListener("click", () => {
  if (narrow.matches) { $("#app").classList.toggle("nav-open"); return; }
  const c = $("#app").classList.toggle("collapsed");
  store.set("collapsed", c);
  if (route().view === "system") setTimeout(() => { drawChart($("#cpu-chart"), HIST.cpu); drawChart($("#mem-chart"), HIST.mem); }, 220);
});
window.addEventListener("resize", () => { if (route().view === "system") { drawChart($("#cpu-chart"), HIST.cpu); drawChart($("#mem-chart"), HIST.mem); } });
window.addEventListener("hashchange", () => { render(); $("main").scrollTop = 0; });

poll();
setInterval(poll, 2000);
pollSystem();
setInterval(pollSystem, 2000);
setInterval(loadLogs, 1500);
</script>
</body>
</html>
